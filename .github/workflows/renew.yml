name: AcoreHosting Auto Renew

on:
  schedule:
    - cron: '0 0 */2 * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 1. 检出仓库代码
        uses: actions/checkout@v4

      - name: 2. 同步系统时钟
        run: |
          sudo timedatectl set-ntp true
          date

      - name: 3. 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 4. 安装系统依赖与 sing-box 代理核心
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xdotool wget curl unzip libxi6 libnss3
          
          # 安装 sing-box 以支持 vless / vmess / hy2 / trojan 协议
          SB_VER="1.10.7"
          wget -q "https://github.com/SagerNet/sing-box/releases/download/v${SB_VER}/sing-box-${SB_VER}-linux-amd64.tar.gz"
          tar -xzf "sing-box-${SB_VER}-linux-amd64.tar.gz"
          sudo mv "sing-box-${SB_VER}-linux-amd64/sing-box" /usr/local/bin/
          sudo chmod +x /usr/local/bin/sing-box
          sing-box version

          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 5. 运行自动续期脚本
        env:
          ACORE_EMAIL: ${{ secrets.ACORE_EMAIL }}
          ACORE_PASSWORD: ${{ secrets.ACORE_PASSWORD }}
          ACORE_SERVER_ID: ${{ secrets.ACORE_SERVER_ID }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python renew.py

      - name: 6. 上传运行截图 (用于排错检查)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-screenshots
          path: "*.png"
          if-no-files-found: ignore
          retention-days: 5
